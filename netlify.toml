[build]
  command = "npm run build"
  # Next.js App Router / Server Actions / API routes are handled by Netlify's official Next.js
  # runtime, auto-detected from this build command -- no publish dir override needed.

[functions]
  # Scheduled Functions (netlify/functions/alert-sweep.mts) live alongside the Next.js app but
  # build separately -- point Netlify at that directory explicitly.
  directory = "netlify/functions"

[build.environment]
  # Next.js's Turbopack build cache (.next/cache/**) can end up with SESSION_SECRET/CRON_SECRET
  # values embedded in its intermediate cache blobs -- that's cache-internal data, never part of
  # the actual served output or client bundle, so it's safe to exclude from Netlify's secrets
  # scan. Narrowly scoped to the cache dir only -- everything else still gets scanned normally.
  SECRETS_SCAN_OMIT_PATHS = "**/.next/cache/**"